# Nothing here calls a model, so there is no model provider section: the whole of this
# service is change propagation, and a model has no part in deciding what order changes
# go in. `toolkit/templates/port-readme.md` asks every port to support every provider the
# SDK offers; a port with no model call has none to support, and says so rather than
# carrying an unused table.

akka.javasdk {
  dev-mode {
    # 9011 in the shared local port registry, so this can run beside the other services.
    http-port = 9011
  }
}
